# Nightly reset: restarting the demo Deployment brings back fresh synthetic data.
apiVersion: v1
kind: ServiceAccount
metadata: {name: occultera-reset}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: occultera-reset}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["occultera"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: occultera-reset}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: occultera-reset}
subjects: [{kind: ServiceAccount, name: occultera-reset}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: occultera-reset}
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: occultera-reset
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, runAsUser: 65532}
          containers:
            - name: kubectl
              image: bitnami/kubectl:1.34
              args: ["rollout", "restart", "deployment/occultera"]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
