name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: "mypy (gradual: web layer and small modules)"
        continue-on-error: true
        run: mypy
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes --no-deps -r requirements.lock
      # Risk-based gate: a vulnerability in a runtime dependency fails the pipeline. Exceptions must be
      # listed in docs/security-exceptions.md and .github/pip-audit-ignore.txt, with an owner and an expiry.
      - name: pip-audit (fails on any known vulnerability)
        run: |
          pip install pip-audit
          ARGS=()
          while read -r id; do
            id="${id%%#*}"
            id="$(echo "$id" | tr -d '[:space:]')"
            if [ -n "$id" ]; then ARGS+=(--ignore-vuln "$id"); fi
          done < .github/pip-audit-ignore.txt
          pip-audit -r requirements.lock --require-hashes --disable-pip --desc ${ARGS[@]+"${ARGS[@]}"}
      - name: SBOM (CycloneDX, Python dependencies)
        run: |
          pip install cyclonedx-bom
          # cyclonedx-py >= 4 takes the requirements file positionally; there is no -r flag any more.
          cyclonedx-py requirements requirements.lock -o sbom-python.cdx.json --of JSON
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-python
          path: sbom-python.cdx.json
          retention-days: 90

  docker:
    runs-on: ubuntu-latest
    needs: [test, dependencies]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: occultera:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the example overlay with every component
        working-directory: deploy/kubernetes/example
        run: |
          cp secret.env.example secret.env
          kubectl kustomize . > /dev/null
          for c in networkpolicy ingress-nginx ingress-traefik-authentik; do
            sed -i "s#^components: .*#components: [../components/$c]#" kustomization.yaml
            kubectl kustomize . > /dev/null && echo "$c OK"
          done

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.15.0
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/occultera
          helm template test deploy/helm/occultera > /dev/null
          helm template test deploy/helm/occultera \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true \
            --set secret.APP_PASSWORD=test > /dev/null

  chart-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.15.0
      - uses: helm/kind-action@v1.15.2
        with:
          cluster_name: wdt
      - name: Build the image from this commit and load it into kind
        # The chart's appVersion points at a release tag that is only published after this commit (a release
        # bump would otherwise wait for an image that does not exist yet) — test the code being pushed instead.
        run: |
          docker build -t occultera:ci .
          kind load docker-image occultera:ci --name wdt
      - name: Install the chart on a real cluster
        run: |
          helm install occultera ./deploy/helm/occultera \
            --set image.repository=occultera --set image.tag=ci --set image.pullPolicy=Never \
            --set secret.APP_PASSWORD=test --set secret.LLM_API_KEY=test \
            --set secret.INDEXER_PASSWORD=test --set secret.API_PASSWORD=test
          # /readyz needs no reachable indexer (readiness is startup-only by design), so the pod becomes Ready
          if ! kubectl wait --for=condition=available --timeout=180s deployment/occultera; then
            kubectl describe pods -l app.kubernetes.io/name=occultera | tail -40
            kubectl logs deploy/occultera --tail=80 || true
            exit 1
          fi
          kubectl get pods

  smoke:
    # A real indexer instead of the demo engine: OpenSearch (what the Wazuh indexer is built on) with Wazuh's own
    # alerts template, synthetic alerts loaded, then the connection test and one full triage run with the mock model.
    runs-on: ubuntu-latest
    needs: [test]
    services:
      indexer:
        image: opensearchproject/opensearch:2.19.3
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      WAZUH_INDEXER_URL: http://127.0.0.1:9200
      WAZUH_VERIFY_TLS: "false"
      WAZUH_ENV_ID: smoke
      LLM_PROVIDER: mock
      APP_PASSWORD: smoke-password-0123456789
      APP_SECRET: smoke-secret-0123456789abcdef0123456789
      ENVIRONMENT: development
      WDT_SCHEDULER: "false"
      WDT_CONFIG: /nonexistent.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --require-hashes --no-deps -r requirements.lock
      - name: Load synthetic alerts into the indexer
        run: python -m tools.smoke_seed http://127.0.0.1:9200
      - name: Connection test (python -m app.check)
        run: python -m app.check --no-llm
      - name: One full run against the real indexer
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8080 > app.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 2; done
          python -m tools.smoke_run http://127.0.0.1:8080 "$APP_PASSWORD" smoke
      - name: Application log
        if: always()
        run: cat app.log || true
